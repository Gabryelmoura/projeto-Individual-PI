<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexium | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/imagens/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="header">
        <button class="voltar"><a class="link-voltar" href="./index.html">Voltar</a></button>

        <div class="logo">
            <h1>Nexium</h1>
        </div>
    </div>

    <div class="login">
        <div class="container">
            <div class="card card-login">          
                <div class="formulario"><h2>Login</h2>
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>

                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>

                    <p>Ainda não tem uma conta? <span><a style="color: rgb(0, 136, 255); text-decoration: none;" href="cadastro.html">Clique Aqui</a></span></p>

                    <div style="color: red;" id="msg_Erro"></div>

                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>
            </div>
        </div>

        <div class="banner"></div>
    </div>

    <div class="footer">
        <div class="container">
            <h1 class="titulo-footer">Nexium</h1>

            <div class="contato">
                <ul>
                    <li>nexium@gmail.com</li>
                    <li>11 98977-9999</li>
                </ul>
            </div>

            <div class="rede">
                <ul>
                    <li>Instagram</li>
                    <li>Facebook</li>
                    <li>GitHub</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>

<script>
    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        let count = 0;
        let erro = true;
        
        var camposLogin = [
            { valor: emailVar, nome: "E-mail", tipo: "email" },
            { valor: senhaVar, nome: "Senha", tipo: "senha" }
        ];

        var errosLogin = [];

        for (var i = 0; i < camposLogin.length; i++) {
            var campoAtual = camposLogin[i];

            if (campoAtual.valor == "") {
                errosLogin.push(`O campo <b>${campoAtual.nome}</b> está vazio.`);
            }

            if (campoAtual.tipo === "email" && !campoAtual.valor.includes("@gmail")) {
                errosLogin.push("O <b>E-mail</b> informado deve conter '@gmail'.");
            }

            if (campoAtual.tipo === "senha" && campoAtual.valor.length < 6) {
                errosLogin.push("A <b>Senha</b> deve ter pelo menos 6 caracteres.");
            }
        }

        if (errosLogin.length > 0) {
            msg_Erro.innerHTML = errosLogin.join("<br>");
            finalizarAguardar();
        } else {
            msg_Erro.innerHTML = "";
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); 

                });

            } else {
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
