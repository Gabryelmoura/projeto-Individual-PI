<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nexium | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="icon" href="./assets/imagens/logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <div class="header">
    <button class="voltar"><a class="link-voltar" href="./index.html">Voltar</a></button>

    <div class="logo">
      <h1>Nexium</h1>
    </div>
  </div>
  <div class="alerta_erro">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <div class="cadastro">
    <div class="banner"></div>

    <div class="container">
      <div class="card card-cadastro">
        <h2>Cadastro</h2>

        <div class="formulario">
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>

          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>

          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>

          <p>Já tem uma conta? <span><a style="color: rgb(0, 136, 255); text-decoration: none;" href="login.html">Clique Aqui</a></span></p>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>

        </div>

        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <h1 class="titulo-footer">Nexium</h1>

      <div class="contato">
        <ul>
          <li>nexium@gmail.com</li>
          <li>11 98977-9999</li>
        </ul>
      </div>

      <div class="rede">
        <ul>
          <li>Instagram</li>
          <li>Facebook</li>
          <li>GitHub</li>
        </ul>
      </div>
    </div>
  </div>
</body>

</html>

<script>

  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    var campos = [
      { valor: nomeVar, nome: "Nome", tipo: "comum" },
      { valor: emailVar, nome: "E-mail", tipo: "email" },
      { valor: senhaVar, nome: "Senha", tipo: "senha" },
      { valor: confirmacaoSenhaVar, nome: "Confirmação da Senha", tipo: "confirmacao" }
    ];

    var erros = [];
    for (var i = 0; i < campos.length; i++) {
      var campoAtual = campos[i];

      if (campoAtual.valor == "") {
        erros.push(`O campo <b>${campoAtual.nome}</b> não pode estar vazio.`);
        continue;
      }

      if (campoAtual.tipo === "email" && !campoAtual.valor.includes("@gmail")) {
        erros.push("O campo <b>E-mail</b> deve conter '@gmail'.");
      }

      if (campoAtual.tipo === "senha" && campoAtual.valor.length < 6) {
        erros.push("A <b>Senha</b> deve conter pelo menos 6 caracteres.");
      }

      if (campoAtual.tipo === "confirmacao" && campoAtual.valor !== senhaVar) {
        erros.push("A <b>Confirmação da Senha</b> não coincide com a senha digitada.");
      }
    }

    if (erros.length > 0) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = erros.join("<br>");

      if (typeof finalizarAguardar === "function") {
        finalizarAguardar();
      }
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para a tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
